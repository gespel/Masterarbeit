[project]
name = "model-compiler"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "gespel", email = "sten.heimbrodt@hotmail.de" }
]
requires-python = ">=3.12"
dependencies = [
    "flowextractor",
    "torch>=2.15.0",
]

[project.scripts]
model-compiler = "model_compiler:main"
model-serializer = "model_compiler.model_serializer:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
flowextractor = { path = "../../tools/FlowExtractor", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/model_compiler"]
